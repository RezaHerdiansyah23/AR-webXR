<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR UTS with Movable VR Block</title>
    <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
    <script src="https://jeromeetienne.github.io/AR.js/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; }
        a-scene { height: 100vh; }
    </style>
</head>
<body>
    <!-- Scene untuk VR -->
    <a-scene embedded arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;" vr-mode-ui="enabled: true">
        
        <!-- Latar belakang luar angkasa -->
        <a-entity 
            id="spaceBackground" 
            geometry="primitive: plane; width: 100; height: 100;"
            material="src: url('background.jpg'); side: double;"
            position="0 0 -10" 
            visible="false"></a-entity>

        <!-- Model Bumi tanpa marker -->
        <a-entity 
            id="planetEarth"
            gltf-model="source/earth/self made Earth.gltf"
            scale="0.5 0.5 0.5" 
            position="3 1 -3"
            animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true"
            visible="false">
        </a-entity>

        <!-- Planet Mars -->
        <a-entity 
            id="planetMars"
            gltf-model="source/mars/scene.gltf"
            scale="0.01 0.01 0.01" 
            position="-3 1 -3"
            animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true"
            visible="false">
        </a-entity>

        <!-- Planet Moon -->
        <a-entity 
            id="planetMoon"
            gltf-model="source/moon/scene.gltf"
            scale="0.3 0.3 0.3" 
            position="0 1 -5"
            animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true"
            visible="false">
        </a-entity>

        <!-- Kamera dan Cursor untuk interaksi -->
        <a-entity camera>
            <a-cursor color="black" fuse="false" />
        </a-entity>

                    
            <!-- Marker untuk Earth -->
            <a-marker type="pattern" url="pattern-earth.patt">
                <a-entity 
                    gltf-model="earth.glb"
                    scale="5 5 5"  
                    position="0 0 0"
                    animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true">
                </a-entity>
            </a-marker>

            <!-- Marker untuk Mars -->
            <a-marker type="pattern" url="pattern-mars.patt">
                <a-entity 
                    gltf-model="mars.glb"
                    scale="5 5 5"   
                    position="0 0 0"
                    animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true">
                </a-entity>
            </a-marker>

            <!-- Marker untuk Moon -->
            <a-marker type="pattern" url="pattern-moon.patt">
                <a-entity 
                    gltf-model="moon.glb"
                    scale="5 5 5"  
                    position="0 0 0"
                    animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true">
                </a-entity>
            </a-marker>


      <!-- Marker untuk Keyboard -->
      <a-marker type="pattern" url="pattern-keyboard.patt">
        <a-entity 
            gltf-model="keyboard.glb" 
            scale="0.1 0.1 0.1" 
            position="0 0 0">
        </a-entity>
    </a-marker>

    <!-- Marker untuk Video -->
    <!-- <a-marker type="pattern" url="pattern-youwin.patt">
        <a-video 
            src="Rick Astley - Never Gonna Give You Up (Official Music Video).mp4" 
            position="0 0 0" 
            rotation="-90 0 0" 
            width="4" 
            height="2.5">
        </a-video>
    </a-marker> -->




    </a-scene>

   

    <script>
        // Mendapatkan referensi ke planet-planet dan latar belakang VR
        const planetEarth = document.getElementById('planetEarth');
        const planetMars = document.getElementById('planetMars');
        const planetMoon = document.getElementById('planetMoon');
        const spaceBackground = document.getElementById('spaceBackground');

        // Menambahkan event listener untuk mendeteksi mode VR
        document.querySelector('a-scene').addEventListener('enter-vr', function() {
            // Saat memasuki mode VR, tampilkan planet-planet dan latar belakang
            planetEarth.setAttribute('visible', true);  
            planetMars.setAttribute('visible', true);
            planetMoon.setAttribute('visible', true);
            spaceBackground.setAttribute('visible', true);  // Menampilkan latar belakang
        });

        document.querySelector('a-scene').addEventListener('exit-vr', function() {
            // Saat keluar dari mode VR, sembunyikan planet-planet dan latar belakang
            planetMars.setAttribute('visible', false);
            planetMoon.setAttribute('visible', false);
            spaceBackground.setAttribute('visible', false);  // Menyembunyikan latar belakang
        });

    </script>
</body>
</html>
